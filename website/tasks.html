<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Manage Tasks</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <div class="container">
    <h2 class="mb-4">Task Management</h2>
    <form class="mb-3">
      <input type="text" class="form-control mb-2" placeholder="Task Title">
      <input type="date" class="form-control mb-2">
      <select class="form-select mb-2">
        <option value="pending">Pending</option>
        <option value="completed">Completed</option>
      </select>
      <button class="btn btn-success">Add Task</button>
    </form>
    <table class="table table-bordered">
      <thead><tr><th>Task</th><th>Deadline</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody>
        <tr><td>Check Assignments</td><td>2025-07-25</td><td>Pending</td>
          <td><button class="btn btn-sm btn-warning">Edit</button> <button class="btn btn-sm btn-danger">Delete</button></td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
